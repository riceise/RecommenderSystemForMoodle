services:
  searxng:
    image: searxng/searxng:latest
    container_name: neurotutor-searxng
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=NeuroTutor Search
    volumes:
      - searxng-data:/etc/searxng
    restart: unless-stopped

volumes:
  searxng-data: